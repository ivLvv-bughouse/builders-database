version: "3.9"

services:
  db:
    image: postgres:16
    container_name: construction_db
    environment:
      POSTGRES_DB: construction_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    restart: unless-stopped

  # pgAdmin — раскомментируйте для использования веб-интерфейса PostgreSQL
  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: construction_pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - db
  #   restart: unless-stopped

volumes:
  pgdata:
